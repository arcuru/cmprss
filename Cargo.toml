[package]
name = "cmprss"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["Patrick Jackson <patrick@jackson.dev>"]
readme = "README.md"
license = "AGPL-3.0-or-later"
description = "A compression multi-tool for the command line."
repository = "https://github.com/arcuru/cmprss"
homepage = "https://github.com/arcuru/cmprss"
categories = ["command-line-utilities", "compression"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
indicatif = "0.18"
is-terminal = "0.4"

brotli = { version = "8", optional = true }
bzip2 = { version = "0.6", features = ["static"], optional = true }
flate2 = { version = "1", optional = true }
lz4_flex = { version = "0.13", optional = true }
sevenz-rust2 = { version = "0.20", optional = true }
snap = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
tempfile = { version = "3", optional = true }
xz2 = { version = "0.1", features = ["static"], optional = true }
zip = { version = "8", optional = true }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
rand = "0.10"
tempfile = "3"

[features]
default = ["full", "interop"]

# All codecs at once — what the published CLI ships with.
full = [
    "gzip",
    "xz",
    "bzip2",
    "zstd",
    "lz4",
    "brotli",
    "snappy",
    "lzma",
    "tar",
    "zip",
    "sevenz",
]

# Reserved for interop tests against system tools; currently a no-op.
interop = []

# Single-stream codecs.
gzip = ["dep:flate2"]
xz = ["dep:xz2"]
lzma = ["dep:xz2"]
bzip2 = ["dep:bzip2"]
zstd = ["dep:zstd"]
lz4 = ["dep:lz4_flex"]
brotli = ["dep:brotli"]
snappy = ["dep:snap"]

# Container formats. Each pulls in tempfile because their compress/extract
# paths spool to a temp file when handed a non-seekable sink/source.
tar = ["dep:tar", "dep:tempfile"]
zip = ["dep:zip", "dep:tempfile"]
sevenz = ["dep:sevenz-rust2", "dep:tempfile"]

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
