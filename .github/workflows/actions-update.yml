name: "Deps: Actions Update"

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      hold_days:
        description: "Days to hold before allowing merge"
        required: false
        default: "7"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  actions-update:
    if: github.repository_owner == 'arcuru'
    uses: arcuru/actions/.github/workflows/actions-update.yml@3cee03dd694bcbfe4a64ae899f4b9a7cbdfe357c # v0.5.0
    with:
      hold-days: ${{ inputs.hold_days || '7' }}
      environment: automation
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
