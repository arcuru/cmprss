name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Format + clippy run once with default features. These are properties of the
  # code, not of any particular feature combination.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # Build + test across representative feature subsets. The matrix catches
  # cfg-gating regressions that the default build would miss — e.g. a lib
  # consumer that opts out of `full` and picks just `gzip + tar`, or one
  # that disables `cli` to drop clap from their dep tree.
  test:
    name: Test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default
            flags: ""
          - label: no-default
            flags: "--no-default-features"
          - label: gzip-only
            flags: "--no-default-features --features cli,gzip"
          - label: tar-only
            flags: "--no-default-features --features cli,tar"
          - label: tar+gzip
            flags: "--no-default-features --features cli,tar,gzip"
          - label: full-no-cli
            flags: "--no-default-features --features full"
          - label: cli+full
            flags: "--no-default-features --features cli,full"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.label }}

      - name: Build
        run: cargo build ${{ matrix.flags }}

      - name: Test
        run: cargo test ${{ matrix.flags }}
