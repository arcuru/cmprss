# release-plz creates drafts with GITHUB_TOKEN, which cannot trigger release
# workflows. Its explicit dispatch assembles both binaries, then publishes once.
# release.published is a read-only asset verification fallback (plus Snap), not
# an opportunity to attach or replace assets on an immutable release.
name: Publish

on:
  workflow_run:
    workflows: ["Nix"]
    types: [completed]
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Draft release tag to assemble/retry (e.g. v1.2.3)"
        required: true
        type: string
      commit_sha:
        description: "Expected tag commit (optional for manual retries)"
        required: false
        type: string

permissions:
  contents: read

# Retries and the published fallback must not race another assembly of this tag.
concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag_name || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.repository_owner == 'arcuru' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       github.event_name == 'release')
    outputs:
      sha: ${{ steps.release.outputs.sha || steps.ci.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
      draft: ${{ steps.release.outputs.draft }}
    steps:
      # Always load control code from trusted main, never from a dispatched tag.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve successful CI commit
        id: ci
        if: github.event_name == 'workflow_run'
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve and inspect release
        id: release
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
          SHA: ${{ inputs.commit_sha }}
        run: python3 .github/scripts/release.py prepare --tag "$TAG" --sha "$SHA"

  snap:
    name: Snap
    needs: prepare
    runs-on: ubuntu-latest
    if: github.repository_owner == 'arcuru'
    environment: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && 'publish' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set snap version from release tag
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          sed -i "s/^version: .*/version: \"${VERSION}\"/" snap/snapcraft.yaml

      - uses: snapcore/action-build@d12445ae70c52b1ead8b8a0ac6635f0432af5c80 # v1.3.0
        id: build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}

      - name: Publish to Snap Store
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  binaries:
    name: Binary (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    if: github.repository_owner == 'arcuru' && needs.prepare.outputs.draft == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Build static binary
        working-directory: source
        run: nix build -L .#cmprss-static

      - name: Package binary
        working-directory: source
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          DIR="cmprss-${TAG}-${TARGET}"
          ASSET="${DIR}.tar.gz"
          mkdir "$DIR"
          install -m 0755 result/bin/cmprss "${DIR}/cmprss"
          cp README.md LICENSE.txt "${DIR}/"
          tar -czf "$ASSET" "$DIR"
          sha256sum "$ASSET" > "${ASSET}.sha256"

      - name: Upload to draft only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          TARGET: ${{ matrix.target }}
        run: |
          python3 .github/scripts/release.py upload --tag "$TAG" --sha "$SHA" \
            --release-id "$RELEASE_ID" --target "$TARGET" --directory source

  finalize:
    name: Verify assets and publish
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Implicit success() also suppresses publication after cancellation/failure.
    # No individual matrix leg can publish, and Snap is not part of this join.
    if: github.repository_owner == 'arcuru' && needs.binaries.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify every required asset, then publish once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          python3 .github/scripts/release.py finalize --tag "$TAG" --sha "$SHA" \
            --release-id "$RELEASE_ID"
