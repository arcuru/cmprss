name: Codeberg Sync

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository_owner == 'arcuru'
    uses: arcuru/actions/.github/workflows/codeberg-mirror.yml@3cee03dd694bcbfe4a64ae899f4b9a7cbdfe357c # v0.5.0
    with:
      destination: git@codeberg.org:arcuru/cmprss.git
    secrets:
      ssh-private-key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
